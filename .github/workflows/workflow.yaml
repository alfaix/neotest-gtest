name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/

  tests:
    name: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        rev: [v0.12.0, nightly]
        gtest_tag: [main]
        include:
          - os: ubuntu-22.04
            rev: v0.12.0
            gtest_tag: release-1.10.0
          - os: ubuntu-22.04
            rev: v0.12.0
            gtest_tag: release-1.11.0
          - os: ubuntu-22.04
            rev: v0.12.0
            gtest_tag: release-1.12.1
          - os: ubuntu-22.04
            rev: v0.12.0
            gtest_tag: v1.13.0
          - os: ubuntu-22.04
            rev: v0.12.0
            gtest_tag: v1.14.0
    env:
      TREE_SITTER_CPP_TAG: v0.23.4
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Neovim
        run: |
          mkdir -p _neovim
          curl -fsL "https://github.com/neovim/neovim/releases/download/${{ matrix.rev }}/nvim-linux-x86_64.tar.gz" | tar xzf - --strip-components=1 -C "${PWD}/_neovim"

      - name: Build cpp tree-sitter parser
        run: |
          git clone --depth 1 --branch ${TREE_SITTER_CPP_TAG} https://github.com/tree-sitter/tree-sitter-cpp _tree-sitter-cpp
          mkdir -p .tests/data/nvim/site/parser
          cc -shared -fPIC -O2 -I_tree-sitter-cpp/src _tree-sitter-cpp/src/parser.c _tree-sitter-cpp/src/scanner.c \
            -o .tests/data/nvim/site/parser/cpp.so

      - name: Run tests
        run: |
          export PATH="${PWD}/_neovim/bin:${PATH}"
          export VIM="${PWD}/_neovim/share/nvim/runtime"
          nvim --version
          make test GTEST_TAG=${{ matrix.gtest_tag }}
